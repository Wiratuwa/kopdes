{% extends "base.html" %}
{% block title %}Transaksi Baru · Kopdes Desa Aseli{% endblock %}
{% block content %}
<h1 class="page-title mb-3">{{ ic('cart-plus') }}Transaksi Baru</h1>
<form method="post" class="card card-body" style="max-width:640px">
  <label class="form-label">Item</label>
  <div id="baris">
    <div class="row g-2 mb-2 baris">
      <div class="col-8"><select class="form-select" name="produk_id" required>
        {% for p in produk %}<option value="{{ p.id }}">{{ p.kode }} - {{ p.nama }} ({{ p.harga|rp }}, stok {{ p.stok }})</option>{% endfor %}
      </select></div>
      <div class="col-3"><input class="form-control" type="number" name="qty" min="1" value="1" required aria-label="Jumlah"></div>
      <div class="col-1"><button type="button" class="btn btn-outline-danger w-100 hapus-baris" aria-label="Hapus baris">{{ ic('x-lg') }}</button></div>
    </div>
  </div>
  <button type="button" class="btn btn-sm btn-secondary mb-3 align-self-start" id="tambahBaris">{{ ic('plus-lg') }}Tambah Item</button>

  <label class="form-label" for="pelanggan_id">Pelanggan (opsional)</label>
  <div class="field mb-2">{{ ic('people') }}<select class="form-select" id="pelanggan_id" name="pelanggan_id">
    <option value="">- Umum -</option>
    {% for c in pelanggan %}<option value="{{ c.id }}">{{ c.nama }}</option>{% endfor %}
  </select></div>
  <div class="form-check mb-4">
    <input class="form-check-input" type="checkbox" name="kasbon" id="kasbon" value="1">
    <label class="form-check-label" for="kasbon">Bayar nanti (kasbon) &mdash; wajib pilih pelanggan</label>
  </div>
  <div class="d-flex gap-2"><button class="btn btn-primary">{{ ic('check-lg') }}Simpan</button>
  <a class="btn btn-secondary" href="{{ url_for('transaksi_list') }}">{{ ic('x-lg') }}Batal</a></div>
</form>
<script>
const wrap = document.getElementById('baris');
document.getElementById('tambahBaris').onclick = () => {
  const c = wrap.firstElementChild.cloneNode(true);
  c.querySelector('input').value = 1;
  wrap.appendChild(c);
};
wrap.addEventListener('click', e => {
  const b = e.target.closest('.hapus-baris');
  if (b && wrap.children.length > 1) b.closest('.baris').remove();
});
</script>
{% endblock %}
