{% extends "base.html" %}
{% block title %}Ganti Password · Kopdes Desa Aseli{% endblock %}
{% block content %}
<section style="max-width:420px" class="mx-auto">
  <h1 class="page-title mb-3">{{ ic('key') }}Ganti Password</h1>
  <form method="post" class="card card-body">
    <label class="form-label" for="password">Password baru</label>
    <div class="field mb-3">{{ ic('lock') }}<input class="form-control" id="password" type="password" name="password" minlength="6" autocomplete="new-password" required></div>
    <label class="form-label" for="konfirmasi">Konfirmasi password baru</label>
    <div class="field mb-4">{{ ic('lock-fill') }}<input class="form-control" id="konfirmasi" type="password" name="konfirmasi" minlength="6" autocomplete="new-password" required></div>
    <button class="btn btn-primary">{{ ic('check-lg') }}Simpan Password</button>
  </form>
</section>
{% endblock %}
