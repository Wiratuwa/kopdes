databases:
  - name: kopdes-db
    plan: free
    databaseName: kopdes
    user: kopdes_user

services:
  - type: web
    plan: free
    name: kopdes
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kopdes-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.6"
